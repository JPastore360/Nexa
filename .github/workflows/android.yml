name: Build NEXA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair NEXA
        run: |
          mkdir build-src
          unzip -q NEXA_v0.1_Android.zip -d build-src

      - name: Compilar APK
        working-directory: build-src/Nexa
        run: gradle --no-daemon assembleDebug

      - name: Preparar APK
        run: cp build-src/Nexa/app/build/outputs/apk/debug/app-debug.apk NEXA-debug.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-debug-apk
          path: NEXA-debug.apk
